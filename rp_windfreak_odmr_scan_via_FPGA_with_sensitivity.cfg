#  Qudi configuration file with ODMR Frequency Tracking + Sensitivity Sweep
#  Based on: rp_windfreak_odmr_scan_via_FPGA.cfg
#  Added: ODMR tracking hardware, logic, and GUI modules
#  Added: Sensitivity sweep logic and GUI modules

global:
    # list of modules to load when starting
    # Options: sensitivity_sweep_gui, odmr_tracking_gui, odmr_gui, time_series_gui
    # Leave empty to load manually, or add the GUI you want to start with
    startup_modules: []

    # Module server configuration for accessing qudi GUI/logic/hardware modules from remote clients
    remote_modules_server:
        address: 'localhost'
        port: 12345

    # Server port for serving the active qudi module namespace locally (localhost).
    # Used by e.g. the Qudi jupyter kernel.
    namespace_server_port: 18861

    # If this flag is set (True), all arguments passed to qudi module APIs from remote
    # (jupyter notebook, qudi console, remote modules) will be wrapped and passed "per value"
    # (serialized and de-serialized). This is avoiding a lot of inconveniences with using numpy in
    # remote clients.
    # If you do not want to use this workaround and know what you are doing, you can disable this
    # feature by setting this flag to False.
    force_remote_calls_by_value: False

    # Qss stylesheet for controlling the appearance of the GUIs.
    # Absolute path or relative to qudi.artwork.styles
    stylesheet: 'qdark.qss'

    # Default root directory for measurement data storage. All eventual data sub-directories should
    # be contained within this directory. This is not enforced, just convention.
    # The fallback directory is <user home>/qudi/Data/
    # Data would be saved e.g. in C:\Users\aj92uwef\qudi\Data\2025\03\2025-03-28
    # default_data_dir: C:\Users\aj92uwef\qudi\Data

    # Save data to daily data sub-directories by default
    daily_data_dirs: True

gui:
    time_series_gui:
        module.Class: 'time_series.time_series_gui.TimeSeriesGui'
        options:
            use_antialias: True  # optional, set to False if you encounter performance issues
        connect:
            _time_series_logic_con: time_series_reader_logic

    odmr_gui:
        module.Class: 'odmr.odmrgui.OdmrGui'
        connect:
            odmr_logic: 'odmr_logic'

    # ==========================================================================
    # ODMR Tracking GUI (inherits from OdmrGui, extends with tracking features)
    # ==========================================================================
    odmr_tracking_gui:
        module.Class: 'odmr_tracking.odmr_tracking_gui.OdmrTrackingGui'
        options:
            use_antialias: True  # Smooth plot rendering
        connect:
            odmr_logic: 'odmr_frequency_tracking_logic'  # Uses same connector name as parent OdmrGui

    # ==========================================================================
    # NEW: Sensitivity Sweep GUI
    # ==========================================================================
    sensitivity_sweep_gui:
        module.Class: 'sensitivity_sweep.sensitivity_sweep_gui.SensitivitySweepGui'
        options:
            use_antialias: True  # Smooth plot rendering
        connect:
            sensitivity_logic: 'sensitivity_sweep_logic'

logic:
    time_series_reader_logic:
        module.Class: 'time_series_reader_logic.TimeSeriesReaderLogic'
        allow_remote: True
        options:
            max_frame_rate: 20  # optional (default: 20Hz)
            channel_buffer_size: 1048576  # optional (default: 1MSample)
            max_raw_data_bytes: 1073741824  # optional (default: 1GB)
        connect:
            streamer: redpitaya_stream

    odmr_logic:
        module.Class: 'odmr_logic.OdmrLogic'
        allow_remote: True
        options:
            default_scan_mode: 'EQUIDISTANT_SWEEP'
            oversampling_factor: 5  # Default oversampling factor (set as needed)
        connect:
            microwave: 'mw_source_synthnv'
            data_scanner: 'redpitaya_finite_sampling'  # <-- This references the Red Pitaya module

    # ==========================================================================
    # ODMR Frequency Tracking Logic (extends OdmrLogic with tracking)
    # ==========================================================================
    odmr_frequency_tracking_logic:
        module.Class: 'odmr_frequency_tracking_logic.OdmrFrequencyTrackingLogic'
        allow_remote: True
        options:
            # ODMR scan options (inherited from OdmrLogic)
            default_scan_mode: 'EQUIDISTANT_SWEEP'
            oversampling_factor: 5

            # Tracking-specific options
            default_lock_bandwidth: 300  # Hz - typical range: 100-1000 Hz
            error_buffer_size: 10000     # samples - holds ~5-6 minutes at 30.5 kHz
            status_poll_interval: 0.1    # seconds - how often to check lock status
        connect:
            # ODMR scan hardware (inherited from OdmrLogic)
            microwave: 'mw_source_synthnv'
            data_scanner: 'redpitaya_finite_sampling'

            # Tracking-specific hardware
            odmr_lock_hw: 'redpitaya_odmr_lock'      # Red Pitaya ODMR lock hardware
            error_streamer: 'redpitaya_stream'       # Error signal streaming

    # ==========================================================================
    # NEW: Sensitivity Sweep Logic
    # ==========================================================================
    sensitivity_sweep_logic:
        module.Class: 'sensitivity_sweep_logic.SensitivitySweepLogic'
        allow_remote: True
        options:
            # Thermal stabilization delay when power changes (seconds)
            thermal_stabilization_time: 180

            # Loop order for parameter sweep
            # Options: 'power', 'f_mod', 'f_dev'
            # Outer loop (first element) changes least frequently
            # Recommendation: Put 'power' first for thermal stability
            sweep_loop_order: ['power', 'f_mod', 'f_dev']

            # ODMR fitting parameters
            which_zero_crossing: 2  # Index of zero crossing to use (0-indexed)
                                    # For NV-: 0 = m_s=0→+1, 1 = middle, 2 = m_s=0→-1
            n_most_prominent_peaks: 5
            min_fit_amplitude: 0.005  # Minimum feature prominence
            min_feature_height: 0.003  # Minimum absolute peak height

            # Off-resonant measurement (optional)
            include_off_resonant_measurement: False
            off_resonant_offset_hz: 30e6  # 30 MHz offset from resonance
        connect:
            odmr_logic: 'odmr_logic'
            time_series_logic: 'time_series_reader_logic'

hardware:
    # ==========================================================================
    # Red Pitaya Stream - For error signal streaming and time series
    # ==========================================================================
    redpitaya_stream:
        module.Class: 'redpitaya.redpitaya_data_instream.RedPitayaDataInStream'
        options:
            redpitaya_config_file: 'rpy_shared_config'  # Shared PyRPL instance
            redpitaya_hostname: '10.203.129.28'  # Your Red Pitaya IP
            channel_buffer_size: 100000  # 100k samples software buffer
            calibration_factor: 1.0
            signal_scale: 1.0
            stream_input: 'demod'  # Stream demodulated error signal
                                   # Options: 'demod' or 'ftw_corr'
            lock_in_filter_ch1: '2kHz'
            # max_fpga_read_samples: null  # null = read all available (prevents overflow)

    # ==========================================================================
    # Red Pitaya ODMR Lock Hardware
    # ==========================================================================
    redpitaya_odmr_lock:
        module.Class: 'redpitaya.redpitaya_odmr_lock.RedPitayaOdmrLockHardware'
        allow_remote: True
        options:
            # Use same PyRPL config for shared instance (CRITICAL for resource sharing)
            redpitaya_config_name: 'rpy_shared_config'

            # Use same Red Pitaya as other modules
            redpitaya_hostname: '10.203.129.28'

    redpitaya_finite_sampling:
        module.Class: 'redpitaya.redpitaya_finite_sampling_input.RedPitayaFiniteSamplingInput'
        allow_remote: True
        options:
            redpitaya_config_name: 'rpy_shared_config'  # Same config_name for sharing pyrpl instance
            redpitaya_hostname: '10.203.129.28'  # Same hostname for sharing pyrpl instance
            calibration_factor: 1.0  # Adjust based on detector/amplifier gain
            trigger_output_duration: 50e-6  # 50 us trigger pulse for Windfreak
            settling_time: 100e-6  # 100 us settling time after frequency switch
            input_channel: 'in1'  # Hardwired to in1 (adc_a) in FPGA
            signal_scale: 1.0  # Additional scale factor if needed
            input_select: 'demod'  # or 'adc' or 'demod'
            lock_in_filter_ch1: '2kHz'

    mw_source_synthnv:
        module.Class: 'microwave.mw_source_windfreak_synthnvpro_redpitaya.MicrowaveRedPitayaWindfreak'
        allow_remote: True
        options:
            windfreak_serial_port: 'COM3'
            windfreak_comm_timeout: 10  # in seconds
            redpitaya_hostname: '10.203.129.28'
            redpitaya_config_name: 'rpy_shared_config'     # This is not the qudi config, but the pyrpl/Red Pitaya config name
            if_frequencies: [19.422e6, 21.580e6, 23.738e6]
            if_frequency_index: 1
            lo_power: 13
            calibration_files:
                19.422e6: 'C:\\Users\\aj92uwef\\PycharmProjects\\qudi-core\\qudi-iqo-modules\\src\\qudi\\hardware\\microwave\\redpitaya\\calibration_results\\2025-06-06-23-01-25\\IF_19.422MHz\\calibration_redpitaya_all_results_IF_19.422MHz.csv'
                21.580e6: 'C:\\Users\\aj92uwef\\PycharmProjects\\qudi-core\\qudi-iqo-modules\\src\\qudi\\hardware\\microwave\\redpitaya\\calibration_results\\2025-06-06-23-01-25\\IF_21.580MHz\\calibration_redpitaya_all_results_IF_21.580MHz.csv'
                23.738e6: 'C:\\Users\\aj92uwef\\PycharmProjects\\qudi-core\\qudi-iqo-modules\\src\\qudi\\hardware\\microwave\\redpitaya\\calibration_results\\2025-06-06-23-01-25\\IF_23.738MHz\\calibration_redpitaya_all_results_IF_23.738MHz.csv'
            enable_fm: True  # Default, can be changed in GUI
            fm_deviation_khz: 600  # Default, can be changed in GUI
            fm_modulation_frequency: 15250  # Default, can be changed in GUI
            multi_frequency_mode: 'triple'  # Default, can be changed in GUI
            multi_frequency_amplitudes: [0.1, 0.1, 0.1]  # Default, can be changed in GUI

            # output_channel: 0  # either 0 or 1


# ==============================================================================
# SENSITIVITY SWEEP USAGE INSTRUCTIONS
# ==============================================================================
#
# The sensitivity sweep module automates ODMR-based magnetic field sensitivity
# measurements with systematic parameter exploration (power, FM freq, FM deviation).
#
# 1. Starting Qudi:
#    qudi -c rp_windfreak_odmr_scan_via_FPGA_with_sensitivity.cfg
#
#    Optional: Add 'sensitivity_sweep_gui' to startup_modules for auto-load
#
# 2. Quick Test (Single Point):
#
#    a. Open Sensitivity Sweep GUI (from Qudi manager if not in startup)
#
#    b. Configure minimal sweep (left panel "Sweep Configuration"):
#       - Power: Min=-20, Max=-20, Points=1
#       - FM Freq: Min=16, Max=16, Points=1 (kHz)
#       - FM Dev: Min=600, Max=600, Points=1 (kHz)
#       - Total: 1 measurement
#
#    c. Set ODMR scan parameters:
#       - Start Freq: 2.86 GHz (adjust to your NV resonance!)
#       - Stop Freq: 2.88 GHz
#       - Points: 1001
#       - Run Time: 60 s
#
#    d. Set time series parameters:
#       - Num Traces: 16 (quick test)
#       - Trace Duration: 1.0 s
#
#    e. Click "START SWEEP"
#       - Expected duration: ~2 minutes
#       - Watch ODMR scan plot update
#       - Watch ASD plot update
#       - Result appears in table
#
# 3. Full Parameter Sweep:
#
#    a. Configure sweep ranges:
#       Power: -25 to -18 dBm, 15 points (linear in power)
#       FM Freq: 16 to 25 kHz, 5 points
#       FM Dev: 500 to 600 kHz, 3 points
#       Total: 225 measurements
#
#    b. Adjust ODMR and streaming settings as needed
#
#    c. Click "START SWEEP" - runs overnight (~8 hours)
#
#    d. Monitor progress:
#       - Progress bar shows completion
#       - Results table fills in real-time
#       - "Best sensitivity" updates as better points are found
#       - Can PAUSE/RESUME at any time
#       - Can CANCEL to stop early (partial results saved)
#
# 4. Results:
#
#    Saved to: C:\Users\aj92uwef\qudi\Data\SensitivitySweep\YYYY-MM-DD_HHMMSS\
#
#    Files:
#    - parameter_sweep_summary.csv - All results in table
#    - sweep_metadata.json - Configuration and best result
#    - Individual ODMR scans, fits, and ASD plots for each point
#
#    Export from GUI: Click "Export to CSV" button in results panel
#
# 5. Interactive Control (Jupyter):
