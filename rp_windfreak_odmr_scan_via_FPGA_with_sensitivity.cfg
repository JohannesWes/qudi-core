#
#    sens.configure_sweep(sweep_params, odmr_params, stream_params)
#    sens.start_sweep()
#
#    # Check status
#    status = sens.get_sweep_status()
#    print(f"Progress: {status['current_index']}/{status['total_points']}")
#
#    # Get results
#    results = sens.get_current_results()
#    print(results)
#
# 6. Configuration Tips:
#
#    Thermal Stability:
#    - Put 'power' first in sweep_loop_order (minimizes power changes)
#    - Increase thermal_stabilization_time if seeing drift (default 180s)
#
#    Fitting:
#    - Adjust which_zero_crossing to select different hyperfine transition
#    - Increase min_fit_amplitude/min_feature_height if fits fail
#    - Check saved fit plots to verify quality
#
#    Performance:
#    - Reduce odmr_run_time for faster sweeps (but worse SNR)
#    - Reduce n_time_traces for faster sweeps (but worse statistics)
#    - Total time ≈ N_points × (odmr_time + stream_time + overhead)
#
#    Off-Resonant Measurements:
#    - Set include_off_resonant_measurement: True
#    - Doubles measurement time per point
#    - Provides background noise reference
#
# 7. Troubleshooting:
#
#    "Fit failed" (sensitivity shows NaN):
#    - Check ODMR scan shows clear hyperfine structure
#    - Verify frequency range contains resonances
#    - Adjust min_fit_amplitude/min_feature_height
#    - Check saved fit plots
#
#    "Module not found":
#    - Ensure qudi-iqo-modules installed: pip install -e .
#    - Check module paths in config are correct
#
#    Streaming issues:
#    - Verify redpitaya_stream is activated
#    - Check time_series_reader_logic is connected
#    - Verify Red Pitaya IP address is correct
#
#    Slow performance:
#    - Expected: 2-3 hours for 75 points (depending on settings)
#    - Much faster than old RPyC approach (saves ~11 min overhead)
#
# 8. Integration with ODMR Tracking:
#
#    The sensitivity sweep can use EITHER:
#    - odmr_logic (standard ODMR, used by sensitivity_sweep_logic)
#    - odmr_frequency_tracking_logic (extended with tracking features)
#
#    They share the same hardware but provide different features:
#    - odmr_logic: Simple ODMR scans + CW mode
#    - odmr_frequency_tracking_logic: Adds frequency lock capabilities
#
#    For sensitivity measurements, odmr_logic is sufficient.
#    Use odmr_tracking_gui separately for lock-in tracking experiments.
#
# ==============================================================================
# ODMR Tracking Usage Instructions (from original config)
# ==============================================================================
#
# 1. Starting Qudi:
#    qudi -c rp_windfreak_odmr_scan_via_FPGA_with_sensitivity.cfg
#
#    Optional: Add 'odmr_tracking_gui' to startup_modules
#
# 2. ODMR Tracking Workflow:
#
#    a. Perform ODMR Scan:
#       - Use standard ODMR GUI or odmr_logic API
#       - Scan around expected resonance frequency
#       - Ensure good signal-to-noise ratio
#
#    b. Open ODMR Tracking GUI:
#       - If not in startup_modules, activate manually from Qudi manager
#       - GUI shows last ODMR scan automatically
#
#    c. Select Fit Range:
#       - Drag the shaded region on ODMR plot to select linear region
#       - OR manually enter min/max frequencies in spinboxes
#       - Choose region with good linear slope (not at dip center)
#
#    d. Fit Resonance:
#       - Click "Fit" button
#       - GUI displays slope [LSB/Hz] and R² (goodness of fit)
#       - Verify R² > 0.95 for good fit
#
#    e. Configure Lock:
#       - Select lock mode:
#         * Integral: Simple, stable (recommended for starting)
#         * PI: Faster response, requires tuning
#       - Set bandwidth (typical: 300 Hz)
#       - If PI mode: Set zero ratio α (typical: 3.0)
#       - Click "Configure" to program hardware
#
#    f. Enable Tracking:
#       - Click "Enable Lock" button
#       - Monitor status indicators:
#         * Locked: Should turn green (ON) within ~100 ms
#         * Saturated: Should stay red (NO)
#         * Error [LSB]: Should fluctuate near zero
#         * Correction [Hz]: Shows frequency offset being tracked
#       - Error signal time series plot shows real-time error
#
#    g. Monitor and Adjust:
#       - If lock doesn't acquire: Check fit range and slope sign
#       - If saturated: Click "Clear" to reset integrator
#       - If oscillating: Reduce bandwidth
#       - If too slow: Increase bandwidth
#
#    h. Disable Tracking:
#       - Click "Disable Lock" when done
#
# 3. Lock Tuning Tips:
#
#    Integral Mode:
#    - Start with BW = 300 Hz
#    - Stable, no overshoot
#    - Increase BW for faster tracking (max ~1 kHz)
#    - Decrease if lock oscillates
#
#    PI Mode:
#    - Start with BW = 300 Hz, α = 3.0 (zero at BW/3 = 100 Hz)
#    - Faster response than integral-only
#    - α = 2.0: Aggressive (zero at BW/2, faster but may overshoot)
#    - α = 3.0: Balanced (zero at BW/3, recommended)
#    - α = 4.0: Conservative (zero at BW/4, slower but very stable)
#
# 4. PyRPL Configuration Notes:
#
#    - All Red Pitaya modules share PyRPL instance via 'rpy_shared_config'
#    - IQ demodulator must be configured for ODMR error signal:
#      * Input: ADC signal (photon counts)
#      * Modulation frequency: Should match your FM frequency (~15.25 kHz)
#      * Phase: Adjust for maximum 1f-I signal on resonance slope
#      * Output: Demod signal routed to scan module and odmr_freq_lock
#
# ==============================================================================
